# Canonical stack — this is the file you deploy.
#
# PULL-ONLY: it references the prebuilt GHCR images (published on each release),
# so `docker compose up -d` on a fresh box pulls and runs them with no build
# toolchain. This is the file a runner (Coolify) points at, and the one
# `scripts/up.sh` / `install.sh` bring up. Pin a release with CAPKA_VERSION
# (e.g. v0.1.6); unset ⇒ :latest.
#
# Overlays (layer with `-f docker-compose.yml -f …`):
#   docker-compose.dev.yml     local dev — hot reload, dev secrets, loopback ports
#   docker-compose.build.yml   build the images from source instead of pulling
#   docker-compose.tls.yml     automatic HTTPS via Caddy
#   docker-compose.backup.yml  scheduled pg_dump sidecar
#
# SECURITY: postgres & sandbox-controller are never published — only `platform`
# is, and only on 127.0.0.1 (a host reverse-proxy fronts it). Secrets have NO
# defaults: supply POSTGRES_PASSWORD, CONTROLLER_SECRET, CAPKA_MASTER_KEY via
# .env (`up.sh` generates them). Services reach each other by compose DNS name.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: Capka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Capka
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Expose the unix socket to the db-init one-shot so it can reset the role
      # password over a trusted local connection (see db-init below).
      - postgres-run:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Capka"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Resource ceilings so one runaway service can't take the host down. Generous
    # by default (they cap true runaway, not normal load); every value is
    # env-overridable to tune for the box.
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-512}

  # One-shot: keep the Postgres role password in sync with POSTGRES_PASSWORD. The
  # official image only applies POSTGRES_PASSWORD when it INITIALISES a fresh
  # volume, so a volume that outlives a password change (reinstall / rotation)
  # keeps the old password and the app crash-loops on auth. Runs on EVERY deploy
  # path, including Coolify and plain `docker compose up` (not just the install
  # scripts). No-op when POSTGRES_PASSWORD is unset (dev). Best-effort: it never
  # fails the stack (a fail-hard here could block a perfectly healthy deploy on a
  # transient blip; a genuinely unhealable drift surfaces in the platform logs).
  #
  # Strategy: PROBE over TCP with the desired password first — if it already
  # works (fresh volume, or already synced) we exit success and touch nothing, so
  # the service_completed_successfully gate actually MEANS "password verified",
  # even on an orchestrator that didn't mount the local socket. Only on an auth
  # failure (real drift) do we reset it over the LOCAL trusted socket (shared via
  # postgres-run, no current password needed), then re-verify over TCP.
  db-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-run:/var/run/postgresql
    environment:
      - DESIRED_PW=${POSTGRES_PASSWORD:-}
    entrypoint:
      - sh
      - -euc
      - |
        [ -n "$${DESIRED_PW:-}" ] || { echo "db-init: POSTGRES_PASSWORD unset — skipping"; exit 0; }
        if PGPASSWORD="$$DESIRED_PW" psql -h postgres -U Capka -d Capka -tAc 'select 1' >/dev/null 2>&1; then
          echo "db-init: database password already in sync"
          exit 0
        fi
        esc=$$(printf '%s' "$$DESIRED_PW" | sed "s/'/''/g")
        psql -h /var/run/postgresql -U Capka -d Capka -v ON_ERROR_STOP=1 \
          -c "ALTER ROLE \"Capka\" WITH PASSWORD '$$esc'" >/dev/null 2>&1 || true
        if PGPASSWORD="$$DESIRED_PW" psql -h postgres -U Capka -d Capka -tAc 'select 1' >/dev/null 2>&1; then
          echo "db-init: database password synced with POSTGRES_PASSWORD"
        else
          echo "db-init: WARNING - could not sync password (the app may fail to authenticate — check its logs)"
        fi
    restart: "no"

  # Narrows the Docker API the controller can reach: only container + exec
  # endpoints, plus image inspect/pull (IMAGES) so the controller can self-heal a
  # pruned sandbox image, and read-only GET /info (INFO) required by the
  # fail-closed gVisor runtime probe. DELETE stays off. The raw host socket is
  # mounted read-only HERE ALONE, on an isolated network the controller alone can
  # reach — defense-in-depth, not a hard root boundary (see SECURITY.md).
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      - CONTAINERS=1
      - EXEC=1
      - POST=1
      - IMAGES=1
      - INFO=1
    volumes:
      # Host Docker socket, read-only. Parameterized so a ROOTLESS daemon (whose
      # socket lives at /run/user/<uid>/docker.sock) works by setting DOCKER_SOCKET
      # in .env — the default is the standard rootful path, unchanged. See SECURITY.md.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    restart: unless-stopped
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-128m}
    pids_limit: ${SOCKET_PROXY_PIDS_LIMIT:-128}

  # Opt-in default-deny egress. Sandboxes that may reach the internet are put on
  # `sandbox-egress` — an INTERNAL network, so Docker installs no route off the
  # bridge for them — and this is the one member that is also on an outward
  # network. It speaks HTTP CONNECT, resolves each requested host itself, and
  # tunnels only to SANDBOX_EGRESS_ALLOW. See SECURITY.md.
  #
  # It runs even with an empty allowlist, so the network exists and the sandbox
  # spec is stable; nothing is routed through it until the list is non-empty.
  #
  # Same image as the controller (it is the same package), but deliberately NOT the
  # same environment: no Docker socket, no database, no CONTROLLER_SECRET, no
  # volumes, and never on `default` or `docker-proxy`. A compromise here must reach
  # neither Postgres nor the Docker API.
  egress-proxy:
    image: ghcr.io/lyosu/capka-controller:${CAPKA_VERSION:-latest}
    pull_policy: always
    # Not a bare `node egress-proxy.js`: images are published only on release tags,
    # so a deployment tracking master — or one pinned to a release older than this
    # service — pulls a controller image that has no egress-proxy.js inside it. That
    # exits 1 on MODULE_NOT_FOUND and, with restart: unless-stopped, crash-loops,
    # which reads as a broken stack to everything watching container state (a
    # Coolify deploy gate) even though the app itself is fine.
    #
    # So probe for the file — but what to do when it is missing depends on whether
    # the operator asked for egress restriction, and the two answers are opposite:
    #
    #  * Allowlist EMPTY: idle. Nothing is gated (this image's controller predates
    #    egress routing — same image, so it cannot know the variable), so nothing is
    #    left unprotected, and idling keeps the deployment from reading as failed.
    #  * Allowlist SET: exit non-zero, loudly. The operator believes sandbox egress
    #    is restricted to those hosts and it is not, because that same old controller
    #    ignores SANDBOX_EGRESS_ALLOW entirely. A silently missing security control
    #    is worse than a visibly failed deploy, so fail the deploy.
    #
    # `$$` is compose's escape for a literal `$`: the value is read from the
    # container's environment at start, not interpolated when compose parses this.
    command:
      - sh
      - -c
      - |
        if [ -f /app/egress-proxy.js ]; then exec node egress-proxy.js; fi
        if [ -n "$$SANDBOX_EGRESS_ALLOW" ]; then
          echo "egress-proxy: SANDBOX_EGRESS_ALLOW is set, but this controller image predates the egress proxy, so sandbox egress is NOT restricted. Run 'docker compose pull' to get current images, then redeploy." >&2
          exit 1
        fi
        echo "egress-proxy: inactive — this controller image predates the egress proxy. Nothing is gated (SANDBOX_EGRESS_ALLOW is empty); pull current images before setting it."
        exec tail -f /dev/null
    environment:
      - SANDBOX_EGRESS_ALLOW=${SANDBOX_EGRESS_ALLOW:-}
      - EGRESS_PROXY_PORT=3128
    networks:
      sandbox-egress:
        # Explicit, because this name is a CONTRACT: the controller hands it to
        # sandboxes as SANDBOX_EGRESS_PROXY_ENDPOINT and their firewall resolves it
        # at startup. Compose would otherwise only alias the service name, so
        # renaming the service would silently cut every sandbox's route out.
        aliases:
          - capka-egress-proxy
        # And a FIXED address, because a sandbox's firewall pins the address it
        # resolved at ITS startup — a rule has to name an address. Left to Docker's
        # allocator, recreating this container (a `pull`, an image change, an
        # `up --force-recreate`) hands it a different one, and every already-running
        # sandbox keeps permitting the old address: no egress, no error, until each
        # one is rebuilt. Must sit inside SANDBOX_EGRESS_SUBNET below; the two are
        # one setting in two places.
        ipv4_address: ${SANDBOX_EGRESS_PROXY_IP:-10.201.7.2}
      egress-out:
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: ${EGRESS_PROXY_MEM_LIMIT:-128m}
    pids_limit: ${EGRESS_PROXY_PIDS_LIMIT:-128}

  sandbox-controller:
    image: ghcr.io/lyosu/capka-controller:${CAPKA_VERSION:-latest}
    # `up -d`'s default pull policy only fetches an image that's missing
    # locally — a redeploy that reuses the same tag (e.g. Coolify's git-based
    # "Redeploy", which never runs `docker compose pull`) would silently keep
    # running the stale cached bits. Always check the registry instead.
    pull_policy: always
    expose:
      - "3001"
    # Reaches the daemon via the restricted socket-proxy (DOCKER_HOST), never the
    # host socket. It pulls the sandbox image on demand (ensureRuntime), so no
    # one-shot builder service is needed here.
    volumes:
      - ./data:/data
    environment:
      - CONTROLLER_SECRET=${CONTROLLER_SECRET}
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DATA_ROOT=/data/storage
      # Durable session state; reconciles against the daemon on boot.
      - DATABASE_URL=postgresql://Capka:${POSTGRES_PASSWORD}@postgres:5432/Capka
      - COMPUTE_BACKEND=docker
      - WORKSPACE_STORE=local
      # Default runc — boots on any Docker host. gVisor is opt-in: set runsc AND
      # install gVisor on the host (scripts/install-gvisor.sh) for the hardened,
      # fail-closed secure profile (untrusted/multi-tenant workloads).
      - SANDBOX_RUNTIME=${SANDBOX_RUNTIME:-runc}
      # Controller auto-detects the daemon-host path backing ./data by inspecting
      # its own mount at boot, so bind mounts resolve regardless of launch cwd.
      # Set HOST_DATA_ROOT only to override.
      - SANDBOX_IMAGE=ghcr.io/lyosu/capka-sandbox:${CAPKA_VERSION:-latest}
      # Egress kill-switch. Default true (agents reach the internet; granted
      # egress is still firewalled off private/metadata ranges). Set false to
      # hard-forbid egress regardless of the in-app toggle (untrusted tenants).
      - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-true}
      # Non-blank turns egress into default-deny: a networked sandbox joins
      # `sandbox-egress` and reaches only these hosts, through egress-proxy above.
      # Blank (the default) keeps today's behaviour — public internet minus the
      # private ranges. Read here only to decide WHICH network a sandbox joins; the
      # proxy reads the same variable to decide what it permits.
      - SANDBOX_EGRESS_ALLOW=${SANDBOX_EGRESS_ALLOW:-}
      - SANDBOX_EGRESS_NETWORK=capka-sandbox-egress
      - SANDBOX_EGRESS_PROXY_ENDPOINT=capka-egress-proxy:3128
      # Optional perimeter for host folder mounts (folder access is off by default;
      # server folders are admin-only + confirm-gated). When set (colon-separated
      # roots), only subpaths of these may be mounted, on top of the system-path
      # denylist. Unset → any non-system path, gated by the admin confirm.
      - SANDBOX_MOUNT_ALLOW=${SANDBOX_MOUNT_ALLOW:-}
      # Per-sandbox RAM. The /tmp + /opt/mcp tmpfs are charged to this same
      # cgroup, so keep headroom.
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-1024}
      # gVisor runtime threads count against this budget. 256 leaves enough
      # headroom for image/document rendering while still containing fork bombs.
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-256}
      # Passed through empty rather than with a default repeated here: the
      # controller treats an empty value as unset and applies its own default, so
      # there is only ever one number to keep in sync (see posFloatEnv/posIntEnv).
      - SANDBOX_CPUS=${SANDBOX_CPUS:-}
      - MAX_SESSIONS_PER_USER=${MAX_SESSIONS_PER_USER:-2}
      # Stop an idle CONTAINER after this (files + row survive, revived on the
      # next tool call).
      - SANDBOX_IDLE_TTL_MS=${SANDBOX_IDLE_TTL_MS:-900000}
      # How long a background job may hold its sandbox past the idle cutoff, and
      # the ceiling on that hold. Empty ⇒ the controller's defaults (1h / 6h).
      - SANDBOX_BUSY_LEASE_MS=${SANDBOX_BUSY_LEASE_MS:-}
      - SANDBOX_BUSY_MAX_MS=${SANDBOX_BUSY_MAX_MS:-}
      # Delete a WORKSPACE (row + disk) unused this long — the real "how long do
      # my files live" knob.
      - WORKSPACE_TTL_MS=${WORKSPACE_TTL_MS:-2592000000}
      # Grace for TRULY orphaned dirs (no DB row) before the sweep removes them.
      - GC_GRACE_MS=${GC_GRACE_MS:-604800000}
    networks:
      - default
      - docker-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Readiness is gated only on reconcile now (the sandbox-image pull runs in
      # the background — see server.js boot), so the controller goes healthy in
      # seconds. This grace just covers reconcile + daemon-connect retries on a
      # busy host without a spurious early "unhealthy". Failing checks during
      # start_period don't count.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the password sync so the controller's DATABASE_URL auth can't
      # race a drifted password on boot.
      db-init:
        condition: service_completed_successfully
      socket-proxy:
        condition: service_started
      # A sandbox in allowlist mode resolves the proxy at startup and refuses to run
      # if it cannot — so the proxy has to exist before any sandbox is created.
      egress-proxy:
        condition: service_started
    restart: unless-stopped
    # Graceful controller shutdown allows up to 8s for active HTTP requests,
    # followed by the final session-activity flush and Postgres pool close.
    stop_grace_period: 15s
    mem_limit: ${CONTROLLER_MEM_LIMIT:-1g}
    pids_limit: ${CONTROLLER_PIDS_LIMIT:-512}

  platform:
    image: ghcr.io/lyosu/capka-platform:${CAPKA_VERSION:-latest}
    pull_policy: always
    # Published on all interfaces by default so it works out of the box with zero
    # config. Behind a reverse proxy (or on a host where Docker publishes past the
    # firewall), set PLATFORM_BIND=127.0.0.1 to bind loopback-only and let the
    # proxy reach it via localhost / the compose network. Container port is 3000.
    ports:
      - "${PLATFORM_BIND:-0.0.0.0}:${PLATFORM_PORT:-3000}:3000"
    # Let the in-process worker drain on redeploy: it stops claiming new tasks on
    # SIGTERM and lets running turns finish (DRAIN_GRACE_MS=25s in worker.ts)
    # before exiting. Must exceed that so Docker doesn't SIGKILL mid-drain.
    stop_grace_period: 35s
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://Capka:${POSTGRES_PASSWORD}@postgres:5432/Capka
      - SANDBOX_CONTROLLER_URL=http://sandbox-controller:3001
      - CONTROLLER_SECRET=${CONTROLLER_SECRET}
      - CAPKA_MASTER_KEY=${CAPKA_MASTER_KEY}
      # The documented escape hatch for accepting the insecure DB-stored key in
      # production. It was read but never passed, so setting it did nothing.
      - ALLOW_DB_MASTER_KEY=${ALLOW_DB_MASTER_KEY:-}
      # Deprecated alias for PUBLIC_URL, still read at runtime and still validated at
      # boot — so leaving it unpassed made a documented fallback a silent no-op.
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-}
      # Public origin. Set it (recommended in prod) so it can't be spoofed via
      # proxy headers; unset → derived from X-Forwarded-*.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Opt-in hardening for the first-run wizard — require this token to claim the
      # admin account on a public deploy. Unset ⇒ frictionless setup.
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Bounded daily database cleanup. Zero days disables retention for that
      # table; live tasks, suspended turns, and pending spend holds are preserved.
      - TASK_RETENTION_DAYS=${TASK_RETENTION_DAYS:-30}
      - USAGE_RETENTION_DAYS=${USAGE_RETENTION_DAYS:-365}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - DB_RETENTION_BATCH_SIZE=${DB_RETENTION_BATCH_SIZE:-1000}
      # Step at which a long tool loop is told to stop calling tools and answer.
      # Unset ⇒ five below the agent step cap.
      - FORCE_TEXT_AFTER_STEPS=${FORCE_TEXT_AFTER_STEPS:-}
      # Hard ceiling on tool-calling steps in one turn. Unset ⇒ 25.
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-}
      # Wall-clock ceiling for one turn, tool calls included. Unset ⇒ 20 minutes.
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-}
      # Fraction of that budget after which the turn answers instead of calling
      # more tools, so a run that will time out still lands on a reply. Unset ⇒ 0.8.
      - WRAP_UP_AFTER_FRACTION=${WRAP_UP_AFTER_FRACTION:-}
      # OPTIONAL agent tracing over OTLP. Unset ⇒ off. These must be listed here:
      # the prod image has no mounted repo and no .env of its own, so a variable set
      # on the host (or in a Coolify service) reaches compose but NOT the container
      # unless it is passed through explicitly. Adding a new OTEL_* knob means adding
      # it here too, or it will silently do nothing in production.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_EXPORTER_OTLP_TRACES_HEADERS=${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      # Read by the OTel SDK itself, not by our code — resource attributes by the
      # env detector, the BSP_* set by BatchSpanProcessor, timeout/compression by
      # the OTLP exporter. Listed because supporting the sampler but not these
      # would be an arbitrary split, and each omission is a silent no-op.
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
      - OTEL_BSP_MAX_QUEUE_SIZE=${OTEL_BSP_MAX_QUEUE_SIZE:-}
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-}
      - OTEL_BSP_SCHEDULE_DELAY=${OTEL_BSP_SCHEDULE_DELAY:-}
      - OTEL_BSP_EXPORT_TIMEOUT=${OTEL_BSP_EXPORT_TIMEOUT:-}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-}
      - CAPKA_TELEMETRY_CONTENT=${CAPKA_TELEMETRY_CONTENT:-}
      - CAPKA_TELEMETRY_CONTENT_REMOTE=${CAPKA_TELEMETRY_CONTENT_REMOTE:-}
      - CAPKA_TELEMETRY_COST=${CAPKA_TELEMETRY_COST:-}
      - CAPKA_TELEMETRY_SPAN_PREFIXES=${CAPKA_TELEMETRY_SPAN_PREFIXES:-}
      - CAPKA_TELEMETRY_EXTRA_ATTRIBUTES=${CAPKA_TELEMETRY_EXTRA_ATTRIBUTES:-}
      # Last resort: `false` stops asking OpenAI-compatible endpoints to report
      # token counts on a stream. Only for a gateway that breaks on the parameter
      # without saying so — the cost of switching it off is turns billed as zero.
      - CAPKA_STREAM_USAGE=${CAPKA_STREAM_USAGE:-}
      # Every knob below was read at runtime but never named here, so an operator
      # could set it and nothing would happen. `environment:` is a whitelist.
      - MAX_TOOL_OUTPUT_CHARS=${MAX_TOOL_OUTPUT_CHARS:-}
      - MAX_TURN_TOOL_OUTPUT_CHARS=${MAX_TURN_TOOL_OUTPUT_CHARS:-}
      - MAX_TOOL_OUTPUT_LINES=${MAX_TOOL_OUTPUT_LINES:-}
      - STREAM_IDLE_SECONDS=${STREAM_IDLE_SECONDS:-}
      - MAX_STREAM_RECOVERIES=${MAX_STREAM_RECOVERIES:-}
      - WORKER_MAX_CONCURRENCY=${WORKER_MAX_CONCURRENCY:-}
      - PG_POOL_MAX=${PG_POOL_MAX:-}
      - JOBS_KEEP_DIRS=${JOBS_KEEP_DIRS:-}
      - JOB_LOG_CAP_MB=${JOB_LOG_CAP_MB:-}
      - VIEW_KEEP_DIRS=${VIEW_KEEP_DIRS:-}
      - OUTPUT_KEEP_FILES=${OUTPUT_KEEP_FILES:-}
      - OUTPUT_FILE_CAP_MB=${OUTPUT_FILE_CAP_MB:-}
      - MAX_MCP_MEDIA_BYTES=${MAX_MCP_MEDIA_BYTES:-}
      - MAX_MCP_TOOL_DESC_CHARS=${MAX_MCP_TOOL_DESC_CHARS:-}
      - MCP_ALWAYS_LOAD=${MCP_ALWAYS_LOAD:-}
      - MCP_DEFER_TOKEN_PCT=${MCP_DEFER_TOKEN_PCT:-}
      - MCP_DEFER_TOKEN_MAX=${MCP_DEFER_TOKEN_MAX:-}
      - CAPKA_SHARE_IMPORT=${CAPKA_SHARE_IMPORT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      # Password sync runs before the app connects (heals reinstall/rotation drift).
      db-init:
        condition: service_completed_successfully
      # service_started, NOT service_healthy: login and the first-run setup wizard
      # never touch the sandbox, so the app must come up and be usable while the
      # controller is still warming (pulling the ~7.5 GB image on a fresh box).
      # Gating platform on controller health was the first-run deadlock — a slow
      # image pull tripped the controller "unhealthy" and aborted `up -d` with
      # "dependency failed to start". Only actual sandbox tool calls wait for the
      # controller; those already tolerate its 503 (see src/lib/sandbox/client.ts).
      sandbox-controller:
        condition: service_started
    restart: unless-stopped
    mem_limit: ${PLATFORM_MEM_LIMIT:-4g}
    pids_limit: ${PLATFORM_PIDS_LIMIT:-1024}

networks:
  # Isolated controller↔socket-proxy link; the (restricted) Docker API isn't
  # reachable from the rest of the stack.
  docker-proxy:

  # Where sandboxes live when an allowlist is configured. `internal` is doing real
  # work: Docker installs NO default route for its members, so a sandbox has no
  # path off this bridge and cannot resolve a public name either — every lookup and
  # every connection has to go through the proxy. The name is fixed (not
  # compose-prefixed) because the controller passes it to the Docker API as a
  # NetworkMode.
  #
  # It is not a complete boundary on its own, which is why the sandbox still runs
  # its own default-deny firewall: members of an internal network can still reach
  # the Docker host's gateway and each other.
  sandbox-egress:
    name: capka-sandbox-egress
    internal: true
    # Fixed subnet so the proxy can hold a fixed address (see ipv4_address above).
    # Override both together if 10.201.7.0/24 collides with a route on the host —
    # Docker refuses to create an overlapping network, so a collision is loud.
    ipam:
      config:
        - subnet: ${SANDBOX_EGRESS_SUBNET:-10.201.7.0/24}

  # The proxy's own way out. Its own network so that reaching the internet never
  # means sharing a network with Postgres or the platform.
  egress-out:
    name: capka-egress-out

volumes:
  postgres-data:
  # Postgres unix socket dir, shared with db-init for the trusted local password reset.
  postgres-run:
