# Build-from-source overlay. Layer it to compile the images locally instead of
# pulling the prebuilt GHCR ones — e.g. on an unpublished commit or a fork:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
# `scripts/up.sh` layers this automatically when CAPKA_BUILD=1. The `image:` tags
# from the base still apply, so a local build is tagged the same as a pull.
services:
  # One-shot service that builds & tags the sandbox execution image locally (the
  # base has no such service — there the controller pulls it). It exits 0 right
  # after building; the controller waits for that so the image exists on first use.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: ghcr.io/lyosu/capka-sandbox:${CAPKA_VERSION:-latest}
    # This service exists to guarantee a locally built sandbox image, so it must
    # never satisfy itself with a pull: with both `image` and `build` set and no
    # policy, a bare `up` (no --build) uses whatever is already local or fetches
    # it, and the from-source stack silently runs the published sandbox instead.
    pull_policy: build
    entrypoint: ["echo", "sandbox image built"]

  # The egress proxy is the controller package under a different command, so it is
  # built here too. Without this it stays a pull of the published controller image —
  # which, on a from-source stack, is both stale (images are published on release
  # tags only, so the file the command runs may not exist in it yet) and a pull over
  # the tag the sandbox-controller build below just produced locally.
  egress-proxy:
    build: ./sandbox-controller
    # Overrides the base `always`: this tag is built here, never fetched.
    pull_policy: build

  sandbox-controller:
    build: ./sandbox-controller
    # Same override as egress-proxy: without it, correctness depends on the caller
    # passing `--build`, and a bare `up` on this overlay pulls a released image
    # over the one just built here.
    pull_policy: build
    # Merges with the base controller's depends_on (postgres, socket-proxy) — wait
    # for the local sandbox build to finish before starting.
    depends_on:
      sandbox:
        condition: service_completed_successfully

  platform:
    build:
      context: .
      target: runner
    pull_policy: build
