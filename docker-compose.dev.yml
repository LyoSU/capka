# Usage: npm run docker:dev
#   (= docker compose -f docker-compose.yml -f docker-compose.build.yml \
#        -f docker-compose.dev.yml up --build)
# Layers dev-only conveniences over the base + build-from-source overlay:
# zero-config default secrets, host-published ports bound to 127.0.0.1 (loopback
# only — never the public iface), and hot-reloading `next dev` (target: dev
# overrides the build overlay's prod `runner` target). Every published port here —
# postgres, sandbox-controller, AND platform — pins 127.0.0.1; the base defaults
# platform to 0.0.0.0 (zero-config prod), so the dev platform port is overridden below.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: Capka
    ports:
      - "127.0.0.1:5432:5432"

  # In dev the DB password is a fixed `Capka` (above) and the controller/platform
  # DATABASE_URLs are hardcoded to it. Given a stray .env in the repo (e.g. left by
  # a prior `up.sh`) with a different POSTGRES_PASSWORD, the base db-init would
  # probe with it, see a mismatch, and rotate the role to it — out from under those
  # hardcoded URLs, breaking dev. Make it an explicit no-op here — dev volumes are
  # ephemeral, no drift to heal.
  db-init:
    entrypoint: ["sh", "-c", "echo 'db-init: no-op in dev'; exit 0"]

  sandbox-controller:
    environment:
      - CONTROLLER_SECRET=capka-sandbox-secret
      # Pin to the dev default password too. The base compose interpolates
      # ${POSTGRES_PASSWORD} (from .env) into the controller's DATABASE_URL, but
      # dev initialises the postgres volume with `Capka` (above). Without this
      # override the controller auths with the .env password and crash-loops
      # against a postgres that only knows the dev one.
      - DATABASE_URL=postgresql://Capka:Capka@postgres:5432/Capka
      # Opt-in escape hatch — lets the controller boot with the default secret.
      # NEVER set this outside local development.
      - ALLOW_DEFAULT_SECRET=true
    ports:
      - "127.0.0.1:3001:3001"

  platform:
    # Tag the dev build separately so it never clobbers the pulled prod
    # `capka-platform:latest` locally — otherwise a later `docker compose up`
    # (pull path) would run this `next dev` image instead of `node server.js`.
    image: capka-platform:dev
    build:
      context: .
      target: dev # full deps, no prod build — gives `next dev` hot-reload
    command: npm run dev
    # Bind the dev server to loopback like the other dev ports — the base compose
    # defaults PLATFORM_BIND to 0.0.0.0 (zero-config prod), which would otherwise
    # expose the hot-reload dev server to the LAN. `!override` REPLACES the base
    # ports list — without it compose *merges* the two entries (0.0.0.0:3000 +
    # 127.0.0.1:3000), the container binds 3000 twice and self-collides with
    # "address already in use".
    ports: !override
      - "127.0.0.1:3000:3000"
    # The base compose allows 4g, sized for a server running the production
    # build. In dev on a 16 GB laptop that ceiling is the problem rather than a
    # safety net: Turbopack's native arena is not returned to the OS once
    # touched, so `next dev` drifts up to whatever it is allowed and parks
    # there — measured 3.84 GiB anon against a 4 GiB limit, on an idle app.
    # Handing it a smaller budget keeps the dev server honest and leaves room
    # for the rest of the machine.
    #
    # 2500m was too tight: the cgroup hit its ceiling 19k times in minutes, and
    # the resulting direct reclaim burned ~190% CPU while the app sat idle.
    # Turbopack's native arena alone measured ~1.9 GiB with the heap at 512 MB,
    # so the real floor is around 2.6 GiB — this leaves headroom above it.
    mem_limit: 3200m
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://Capka:Capka@postgres:5432/Capka
      - SANDBOX_CONTROLLER_URL=http://sandbox-controller:3001
      - CONTROLLER_SECRET=capka-sandbox-secret
      # Experimental share-link import — enabled in dev so it can be exercised
      # locally; stays off by default in prod (operators opt in explicitly).
      - CAPKA_SHARE_IMPORT=true
      # Node sizes V8's heap from the memory it *sees* — the whole OrbStack VM
      # (7.8 GiB), not this container's 4 GiB cgroup. That lands the default cap
      # at ~2.05 GiB, and `next dev` will happily drift right up to it: heap sat
      # at 2051 MB with the app idle, so V8 was running full Mark-Compacts just
      # to stay under the wall while RSS pinned at 3.7 GiB. Capping it lower
      # makes V8 collect on its own schedule instead of at the ceiling, and hands
      # the ~1.5 GiB back to a 16 GB Mac that is already deep in swap.
      # Turbopack's own memory is native (outside the heap), so mem_limit must
      # stay comfortably above this number.
      - NODE_OPTIONS=--max-old-space-size=1024
