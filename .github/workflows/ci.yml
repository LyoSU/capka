name: CI

# Gate every push to master and every PR on the same checks a maintainer runs
# locally: typecheck, lint, unit tests, and a production build. Database-backed
# integration tests run separately against an ephemeral PostgreSQL service.
#
# workflow_dispatch runs it on any ref — publish-images.yml starts it on a release
# tag whose commit never got a finished push run (not the tip of its push, or
# cancelled by a newer one), since a release publishes only a commit CI passed.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the in-progress run — don't burn minutes
# on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sandbox-controller/package-lock.json

      - run: npm ci
      # The sandbox-controller is a separate Node package; its unit tests (run in
      # the same vitest pass) import its own deps (pg), so install them too.
      - run: npm ci --prefix sandbox-controller

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: Capka
          POSTGRES_PASSWORD: Capka
          POSTGRES_DB: Capka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U Capka -d Capka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://Capka:Capka@localhost:5432/Capka
      RUN_INTEGRATION: "1"
      # The sandbox-controller's own DB-backed suites gate on this instead of
      # DATABASE_URL, so a developer running them can never point them at a real
      # database by accident (they truncate tables). The service above IS
      # throwaway, so CI sets it and those suites finally run: before this, both
      # were green in CI only because they always skipped.
      TEST_DATABASE_URL: postgresql://Capka:Capka@localhost:5432/Capka
      # Deliberately NOT UTC. Every timestamp column is `timestamp without time
      # zone`, so a client that encodes dates in the process timezone silently
      # shifts them — invisible on a UTC runner, and it shipped a scheduler that
      # fired automations hours early on self-hosted boxes with a local TZ. A
      # negative offset keeps that class of bug failing here instead of in prod.
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sandbox-controller/package-lock.json

      - run: npm ci
      # The controller's HTTP suite boots the real server, which imports dockerode
      # — a dep of the controller package, not the root one.
      - run: npm ci --prefix sandbox-controller

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Test database integrations
        run: npm run test:integration:db

  # The release images, built (never pushed) on every push and PR, so a broken
  # Dockerfile fails here instead of on the release tag — where cutting the tag is
  # already the deploy. amd64 only: the arm64 cells differ in runner, not in recipe.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: platform
            context: .
            file: Dockerfile
            target: runner
          - name: controller
            context: ./sandbox-controller
            file: ./sandbox-controller/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.image.name }}
          cache-to: type=gha,scope=ci-${{ matrix.image.name }},mode=max

  # Whether this change can affect the sandbox image: the heavy one (~4.5 GB, the
  # slowest build by far), so it is built only when something it is made of moved.
  # A dispatched run has no change to diff and builds it unconditionally.
  sandbox-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sandbox:
              - Dockerfile.sandbox
              - sandbox-entrypoint.sh
              - scripts/sandbox-*
              - sandbox-controller/**

  # Build the sandbox image and run the same smoke test the release runs on it
  # (publish-images.yml), through the real DockerBackend. The `docker` driver
  # builds straight into the runner's daemon, so the smoke test needs no second
  # copy of the image; no layer cache, because one would evict every other cache
  # from the repository's 10 GB budget.
  sandbox-image:
    needs: sandbox-changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.sandbox-changes.outputs.sandbox == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox-controller/package-lock.json

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/amd64
          push: false
          load: true
          tags: capka-sandbox:ci

      - name: Smoke-test the sandbox image
        run: |
          npm ci --prefix sandbox-controller
          node sandbox-controller/smoke-image.mjs capka-sandbox:ci
