name: Publish images

# Build and push the prebuilt images to GHCR on every release tag (vX.Y.Z), so a
# box can `docker compose pull` instead of building locally — no build toolchain
# needed on the host. The base compose keeps its `build:` stanzas as a fallback,
# so cloning + building still works without any of these images existing.
#
# Architecture: each image is built once PER architecture on a native runner
# (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm — both free on public repos),
# then a separate `merge` job stitches the two per-arch digests into one
# multi-arch manifest list carrying the semver tags. This replaces the old
# single-runner QEMU cross-build: arm64 is no longer emulated instruction-by-
# instruction (which crawled on the heavy `sandbox` apt layer), and the two
# arches build in parallel, so total time is ≈ max(amd64, arm64), not their sum.
#
# Release ordering matters: the in-app update banner keys off the newest GitHub
# *Release* (api /releases/latest), while the host updater pulls the matching
# image *tag*. If the Release existed before its images did, an operator who hit
# "update" in that window would 404 on the pull and silently fall back to a slow
# local build. So the `release` job publishes the GitHub Release LAST — only
# after `merge` has pushed the images — which is why you do NOT `gh release
# create` by hand: just push a vX.Y.Z tag and this workflow does the rest.
#
# First run prerequisites (one-time, in the GitHub repo): Settings → Actions →
# Workflow permissions must allow read/write, and the resulting packages default
# to private — make them public (or pull with a token) for unauthenticated pulls.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run at a time, across every ref: `:latest` and the `stable` branch are two
# halves of one channel, so two overlapping runs (a re-run of an older tag, two
# releases pushed minutes apart) could finish in opposite orders and leave the
# channel pointing at different releases — or roll it backwards. Queue instead.
concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Publish only a commit CI already passed: cutting the tag is the deploy, so a
  # red commit must stop here, before any image or channel moves. Waits (bounded)
  # for a CI run still in progress — the release commit and its tag are usually
  # pushed together — and refuses when CI failed.
  #
  # A push to master runs CI only on the TIP of that push, and a newer push cancels
  # the run in progress, so the release commit often never gets a finished push run
  # (in a busy repo another commit lands on top of it within minutes). When there is
  # no run for it, or only cancelled ones, the gate starts CI on the tag itself
  # (workflow_dispatch, head_sha = the tag commit) once, and waits for that.
  #
  # Also decides the channels. A prerelease tag (v1.0.0-rc.1) publishes only its
  # own image tag. A plain vX.Y.Z moves each moving tag it is the newest release
  # of: vX.Y, vX, and — only as the newest release overall — `latest`, `stable`
  # and the GitHub Release marked latest. So a maintenance release on an older
  # line, or a re-run of an old tag, never rolls a channel backwards.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      plain: ${{ steps.channel.outputs.plain }}
      newest: ${{ steps.channel.outputs.newest }}
      newest_major: ${{ steps.channel.outputs.newest_major }}
      newest_minor: ${{ steps.channel.outputs.newest_minor }}
    steps:
      - id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            printf '%s=false\n' plain newest newest_major newest_minor >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plain=true" >> "$GITHUB_OUTPUT"
          releases="$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          # Is this tag the newest release whose name starts with $2?
          newest() { [ "$(awk -v p="$2" 'index($0, p) == 1' <<< "$releases" | tail -n1)" = "$REF_NAME" ] && echo "$1=true" || echo "$1=false"; }
          newest newest "v" >> "$GITHUB_OUTPUT"
          newest newest_major "v${BASH_REMATCH[1]}." >> "$GITHUB_OUTPUT"
          newest newest_minor "v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}." >> "$GITHUB_OUTPUT"

      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          dispatched=
          rerun="Re-run CI on this commit (Actions → CI → Run workflow → $REF_NAME, or \`gh workflow run ci.yml --ref $REF_NAME\`), then re-run this workflow."
          while :; do
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::CI for $SHA did not finish within 90 minutes. $rerun"
              exit 1
            fi
            # A transient API error must not fail the release: retry until the deadline.
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | {status, conclusion}]')" \
              || { sleep 30; continue; }
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed for $SHA."
              exit 0
            fi
            if jq -e 'any(.[]; .status == "completed" and .conclusion != "cancelled")' <<< "$runs" > /dev/null; then
              echo "::error::CI did not pass for $SHA ($(jq -c 'map(.conclusion)' <<< "$runs")). Fix it, or if it was a flake: $rerun"
              exit 1
            fi
            # No run that can still finish: none at all a few minutes after the push
            # (this commit was not the tip of a push to master), or only cancelled
            # ones (master moved on mid-run). Start one on the tag, once; refuse if
            # that one is cancelled too.
            count="$(jq length <<< "$runs")"
            if jq -e 'all(.[]; .status == "completed")' <<< "$runs" > /dev/null \
               && { [ "$count" -gt 0 ] || [ "$SECONDS" -gt 300 ]; }; then
              if [ -z "$dispatched" ]; then
                echo "No CI run that can finish for $SHA; starting CI on $REF_NAME."
                gh workflow run ci.yml --repo "$REPO" --ref "$REF_NAME" || { sleep 30; continue; }
                dispatched="$count"
              elif [ "$count" -gt "$dispatched" ]; then
                echo "::error::The CI run started for $SHA was cancelled. $rerun"
                exit 1
              fi
            fi
            sleep 30
          done

  build:
    needs: gate
    # One job per (image, arch) cell → 6 native jobs, no QEMU. arm64 cells land
    # on GitHub's free public-repo ARM runner; amd64 on the standard one.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: platform
            context: .
            file: Dockerfile
            target: runner
          - name: controller
            context: ./sandbox-controller
            file: ./sandbox-controller/Dockerfile
            target: ""
          - name: sandbox
            context: .
            file: Dockerfile.sandbox
            target: ""
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # GHCR rejects a mixed-case path, but github.repository_owner is "LyoSU".
      # metadata-action lowercases its own output, but here we hand-build the
      # image ref for both build-push's outputs.name and the merge step, so
      # lowercase it once ourselves (bash ${var,,}) and reuse it.
      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/capka-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only labels here — no tags. The per-arch image is pushed by digest and
      # stays untagged; the merge job attaches the human tags to the manifest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          # Stamp the version into the platform image so Settings → Updates can
          # report it. Use the exact git ref (v0.1.0 on a tag) so it matches the
          # release tag the in-app check compares against. controller/sandbox
          # ignore these args.
          build-args: |
            CAPKA_VERSION=${{ github.ref_name }}
            CAPKA_GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: publish the layers under a content-addressed digest
          # with no tag. The merge job references these digests to assemble the
          # manifest list.
          outputs: type=image,name=${{ steps.img.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          # One cache scope per (image, arch): a native arm64 build no longer
          # shares (and invalidates) the amd64 scope. mode=max is affordable now
          # that each arch is a single-platform build — no more doubling the
          # heavy sandbox layers into one 10 GB-budgeted key.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max

      # The last point at which a broken sandbox image can still be stopped: this
      # workflow runs on a v* tag, and cutting that tag IS the deploy (the merge job
      # moves `stable`, and the public demo redeploys itself on that push). A failure
      # here fails this matrix cell, so `merge` never runs and nothing is released.
      #
      # It checks what NO other gate can: four defects shipped in this image while
      # pip list, dpkg -l, tsc and vitest were all green, because they only appear at
      # runtime — and the worst of them only under the container's read-only rootfs,
      # where LibreOffice and Chromium could not create a profile and produced no file
      # at all. smoke-image.mjs therefore builds its container through the real
      # DockerBackend rather than a hand-written `docker run`, so the posture it tests
      # cannot drift from the one production uses.
      #
      # The build pushed by digest and never loaded the image into this runner's
      # daemon, so pull those exact bytes back. Digest-addressed: it cannot test a
      # different build than the one just made.
      - name: Smoke-test the sandbox image
        if: matrix.image.name == 'sandbox'
        env:
          REF: ${{ steps.img.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF@$DIGEST"
          docker tag "$REF@$DIGEST" capka-sandbox:ci
          npm ci --prefix sandbox-controller
          node sandbox-controller/smoke-image.mjs capka-sandbox:ci

      # Hand the digest to the merge job. The filename is the digest itself; the
      # file is empty — merge only needs the names.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [gate, build]
    strategy:
      fail-fast: false
      matrix:
        name: [platform, controller, sandbox]
    steps:
      # Pull both per-arch digest markers for this image (merge-multiple flattens
      # the two upload-artifact names into one /tmp/digests dir).
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/capka-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the `v` prefix so image tags match the git tag (v0.1.0): the default
      # {{version}} pattern strips it, which would make the scripts' `:v0.1.0`
      # pull 404 and fall back to a local build.
      #
      # vX.Y and vX are moving image tags for pinning a line: CAPKA_VERSION=v1
      # pulls every 1.x release and never a 2.0. That pins the IMAGES only — it is
      # coherent with a compose file from the same major, not with one from
      # `stable` or `master`. metadata-action skips both for a prerelease (and vX
      # for a 0.x version); the gate skips each one this tag is not the newest of.
      #
      # `latest` means "the newest RELEASE", and every pull-only deployment that
      # sets no CAPKA_VERSION resolves to it — so only a push of the newest plain
      # vX.Y.Z tag may move it. A manual workflow_dispatch publishes a `sha-` tag
      # instead (still gated on green CI for that commit): pullable for debugging,
      # but it cannot make every `:latest` stack jump to an unreleased build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ref }}
          # latest=false because the default (`auto`) attaches `latest` to any
          # semver tag by itself — including a workflow_dispatch aimed at a tag,
          # which would move it behind the explicit entry below.
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'push' && needs.gate.outputs.newest_minor == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'push' && needs.gate.outputs.newest_major == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && needs.gate.outputs.newest == 'true' }}
            type=sha,format=long,prefix=sha-,enable=${{ github.event_name != 'push' }}

      # Stitch the per-arch digests into one manifest list per tag. jq builds the
      # `-t ref:tag` flags from metadata's JSON; the trailing loop appends each
      # digest as a source (ref@sha256:...).
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.img.outputs.ref }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.img.outputs.ref }}:${{ steps.meta.outputs.version }}

  # Point the `stable` branch at the commit whose images were just published.
  #
  # This closes the class of break that forced v0.27.0: a compose file tracked
  # from git is always newer than images published only on release tags, so a
  # pull-only stack following `master` runs new compose against the last
  # release's images — a service the compose file added but the image does not
  # have yet crash-loops, and reads as a failed deployment. `stable` always names
  # a commit whose compose and images match, so that is what a pull-only
  # deployment (Coolify, scripts/update.sh) follows; `master` stays the
  # development tip and requires building from source.
  stable:
    runs-on: ubuntu-latest
    needs: [gate, merge]
    if: github.event_name == 'push' && needs.gate.outputs.newest == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Move stable to this release
        env:
          # github.sha IS the commit the tag points at, so nothing has to resolve
          # the tag object — one less way for this to fail after the images are
          # already published, which would strand the whole channel silently.
          SHA: ${{ github.sha }}
        run: |
          # Forced: a release need not be a descendant of the previous one (a
          # hotfix cut from another line), and this branch is machine-owned — its
          # only meaning is "the newest release", never someone's work in progress.
          git push origin "+${SHA}:refs/heads/stable"

  # Publish the GitHub Release LAST — after merge has pushed every image tag — so
  # the in-app update banner (which watches /releases/latest) can never point at a
  # version whose images aren't pullable yet. Runs only on a real tag push, never
  # on workflow_dispatch. Notes come from the matching CHANGELOG section, so the
  # release procedure is just: bump CHANGELOG, commit, push a vX.Y.Z tag.
  release:
    runs-on: ubuntu-latest
    # Also needs `stable`: a Release announcing a version whose deploy channel
    # never moved would send everyone tracking `stable` to update to code they
    # cannot get. If the branch push fails, no Release is published either. A
    # release that is not the newest skips `stable` by design and is published
    # without the latest mark (a prerelease also as a prerelease), so
    # /releases/latest (the in-app update banner) never returns it.
    needs: [gate, merge, stable]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.merge.result == 'success'
      && (needs.stable.result == 'success' || (needs.stable.result == 'skipped' && needs.gate.outputs.newest == 'false')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not inline in run: — keeps a tag value out of the shell command
          # string (workflow-injection hygiene), even though vX.Y.Z tags are trusted.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PLAIN: ${{ needs.gate.outputs.plain }}
          NEWEST: ${{ needs.gate.outputs.newest }}
        run: |
          version="${TAG#v}"
          # Slice this version's section out of CHANGELOG: from its `## [x.y.z]`
          # heading to the next `## [` heading. awk is fed $version as a variable
          # (no shell interpolation into the program).
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f' CHANGELOG.md)"
          notes="${notes}

          **Full changelog:** https://github.com/${REPO}/blob/master/CHANGELOG.md"
          # Idempotent and forgiving of a pre-created draft: if a release already
          # exists for this tag (e.g. an operator staged notes as a draft), publish
          # it as latest; otherwise create it fresh from the CHANGELOG slice.
          if [ "$NEWEST" = true ]; then channel=(--latest)
          elif [ "$PLAIN" = true ]; then channel=(--latest=false)
          else channel=(--prerelease --latest=false); fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --draft=false "${channel[@]}" --title "Capka $TAG 🐾" --notes "$notes"
          else
            gh release create "$TAG" --repo "$REPO" "${channel[@]}" --title "Capka $TAG 🐾" --notes "$notes"
          fi
